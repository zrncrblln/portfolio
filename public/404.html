<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting...</title>
    <script>
      var path = window.location.pathname;
      if (!path || path === "/portfolio/" || path === "/portfolio") {
        window.location.replace("/portfolio/");
      } else {
        window.location.replace("/portfolio/?/" + path);
      }
    </script>
  </head>
  <body>
    <p>Redirecting...</p>
  </body>
</html>
